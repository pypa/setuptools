name: Test Suite

on:
  workflow_call:
    inputs:
      python:
        description: Python version
        type: string
        default: "3.x"
      platform:
        description: Runner platform
        type: string
        default: ubuntu-latest
      tox-env:
        description: >-
          Tox environment to run; if empty, runs default tox
        type: string
        default: ""
      job:
        description: >-
          Name of the calling job, used to tag published coverage
        type: string
        default: ""
      distutils:
        description: >-
          Value for SETUPTOOLS_USE_DISTUTILS (defaults to 'local')
        type: string
        default: ""
      full-test:
        description: >-
          Run setuptools' full test harness: pre-built distributions, the
          setupcfg download cache, and coverage publishing. Off for the
          lighter collateral jobs (docs, diffcov).
        type: boolean
        default: false

env:
  # Environment variable to support color support (jaraco/skeleton#66)
  FORCE_COLOR: 1

  # Suppress noisy pip warnings
  PIP_DISABLE_PIP_VERSION_CHECK: 'true'
  PIP_NO_WARN_SCRIPT_LOCATION: 'true'

  # Ensure tests can sense settings about the environment
  TOX_OVERRIDE: >-
    testenv.pass_env+=GITHUB_*,FORCE_COLOR

jobs:
  run:
    runs-on: ${{ inputs.platform }}
    # Tolerate failures on pre-release Pythons (jaraco/skeleton#199)
    # XXX: pypy seems to be flaky with unrelated tests in pypa/setuptools#6345
    continue-on-error: ${{ inputs.python == '3.15' || inputs.python == 'pypy3.11' }}
    permissions:
      contents: read
    timeout-minutes: 75
    env:
      SETUPTOOLS_USE_DISTUTILS: ${{ inputs.distutils || 'local' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        # Install dependencies for building packages on pre-release Pythons
        # jaraco/skeleton#161
        if: inputs.python == '3.15' && inputs.platform == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libxml2-dev libxslt-dev
      - name: Setup Python
        id: python-install
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}
          allow-prereleases: true
      - uses: actions/cache@v4
        if: inputs.full-test
        id: cache
        with:
          path: setuptools/tests/config/downloads/*.cfg
          key: >-
            ${{ hashFiles('setuptools/tests/config/setupcfg_examples.txt') }}-
            ${{ hashFiles('setuptools/tests/config/downloads/*.py') }}
      - name: Populate download cache
        if: inputs.full-test && steps.cache.outputs.cache-hit != 'true'
        working-directory: setuptools/tests/config
        run: python -m downloads.preload setupcfg_examples.txt
      - name: Adjust env vars
        if: inputs.full-test
        shell: bash
        run: |
          echo 'PIPX_DEFAULT_PYTHON=${{ steps.python-install.outputs.python-path }}' >> $GITHUB_ENV
      - name: Pre-build distributions for test
        if: inputs.full-test
        shell: bash
        run: |
          rm -rf dist
          # workaround for pypa/setuptools#4333
          pipx run --pip-args 'pyproject-hooks!=1.1' build
          echo "PRE_BUILT_SETUPTOOLS_SDIST=$(ls dist/*.tar.gz)" >> $GITHUB_ENV
          echo "PRE_BUILT_SETUPTOOLS_WHEEL=$(ls dist/*.whl)" >> $GITHUB_ENV
          rm -rf setuptools.egg-info  # Avoid interfering with the other tests
      - name: Workaround for unreleased PyNaCl (pyca/pynacl#805)
        if: inputs.full-test && contains(inputs.python, 'pypy')
        run: echo "SETUPTOOLS_ENFORCE_DEPRECATION=0" >> $GITHUB_ENV
      - name: Install tox
        run: python -m pip install tox
      - name: Run
        if: ${{ !inputs.tox-env }}
        run: tox
      - name: Run ${{ inputs.tox-env }}
        if: ${{ inputs.tox-env }}
        run: tox -e ${{ inputs.tox-env }}
      - name: Create coverage report
        if: inputs.full-test && hashFiles('.coverage') != ''  # Rudimentary `file.exists()`
        run: pipx run coverage xml --ignore-errors
      - name: Publish coverage
        if: inputs.full-test && hashFiles('coverage.xml') != ''  # Rudimentary `file.exists()`
        uses: codecov/codecov-action@v4
        with:
          flags: >-  # Mark which lines are covered by which envs
            CI-GHA,
            ${{ inputs.job || github.job }},
            OS-${{ runner.os }},
            VM-${{ inputs.platform }},
            Py-${{ steps.python-install.outputs.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
